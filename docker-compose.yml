services:
    tabybot:
        build:
            context: .
            args:
                TABYBOT_VERSION: dev
        container_name: tabybot
        environment:
            TABYBOT_MODE: docker
            TABYBOT_HOME: ${TABYBOT_HOME:-}
            TABYBOT_DOCKER_SHELL: ${TABYBOT_DOCKER_SHELL:-docker}
            TABYBOT_WEB_TOKEN: ${TABYBOT_WEB_TOKEN:-}
            CAMOFOX_HOST: 127.0.0.1
            CAMOFOX_PORT: 9377
            CAMOFOX_AUTH_MODE: disabled
            CAMOFOX_HEADLESS: "false"
            CAMOFOX_HUMANIZE: "true"
            CAMOFOX_IDLE_TIMEOUT_MS: "3153600000000"
            CAMOFOX_IDLE_EXIT_TIMEOUT_MS: "3153600000000"
            CAMOFOX_SESSION_TIMEOUT: "3153600000000"
            CAMOFOX_PROFILES_DIR: /app/user/camofox/profiles
            CAMOFOX_COOKIES_DIR: /app/user/camofox/cookies
            CAMOFOX_DOWNLOADS_DIR: /app/user/camofox/downloads
            CAMOFOX_TRACES_DIR: /app/user/camofox/traces
        # Persistent state (config, memory, MCP, scheduling). Defaults: codes/templates/user
        volumes:
            - tabybot-user:/app/user
        # 호스트 측은 기본으로 모든 인터페이스에 연다 — 이 머신만 쓰려면 TABYBOT_BIND=127.0.0.1.
        # LAN에 열릴 때는 TABYBOT_WEB_TOKEN 설정을 권장.
        ports:
            - "${TABYBOT_BIND:-0.0.0.0}:${TABYBOT_PORT:-8999}:8999"
        restart: unless-stopped

volumes:
    tabybot-user:
