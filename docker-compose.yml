services:
    tabybot:
        build:
            context: .
            args:
                TABYBOT_VERSION: dev
        container_name: tabybot
        env_file:
            - .env
        environment:
            TABYBOT_MODE: docker
            TABYBOT_HOME: ${TABYBOT_HOME:-}
            TABYBOT_DOCKER_SHELL: ${TABYBOT_DOCKER_SHELL:-docker}
        # Persistent state (config, memory, MCP, cron). Defaults: codes/templates/user
        volumes:
            - tabybot-user:/app/user
        ports:
            - "${TABYBOT_PORT:-8999}:8999"
        restart: unless-stopped

volumes:
    tabybot-user:
