
// tabyBot: 새 페이지를 새 창이 아니라 그 프로필 창의 탭으로 연다.
// Docker 빌드 때 patch-camoufox-tabs.mjs가 juggler 코드 모양을 확인한 뒤 camoufox.cfg 끝에 붙인다.
//
// juggler(Playwright의 Firefox 제어 코드)는 페이지마다 창을 새로 띄우고, Camoufox는 가려진 창도 활성으로 묶어 둔다.
// 그래서 열린 페이지가 전부 앞에 있는 것처럼 계속 화면을 그린다. 탭으로 열면 뒤에 있는 탭은 Firefox가 그리기를 멈춘다.
// 클릭과 입력은 juggler가 그 탭을 먼저 앞으로 가져온 뒤 보내므로 뒤에 있는 탭도 그대로 조작된다.
try {
    const { TargetRegistry, PageTarget } = ChromeUtils.importESModule("resource://gre/modules/juggler/TargetRegistry.js");

    const openInNewWindow = TargetRegistry.prototype._newPageInternal;
    TargetRegistry.prototype._newPageInternal = async function ({ browserContextId }) {
        const browserContext = this.browserContextForId(browserContextId);
        const userContextId = browserContext.userContextId || 0;
        let win = null;
        for (const w of Services.wm.getEnumerator("navigator:browser")) {
            if (!w.closed && w.gBrowser?.tabs.some((t) => (t.userContextId || 0) === userContextId)) win = w;
        }
        // 첫 페이지이거나 창이 모두 닫혔으면 원래대로 창을 띄운다
        if (!win) return openInNewWindow.call(this, { browserContextId });

        const tab = win.gBrowser.addTab("about:blank", { userContextId, triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal() });
        win.gBrowser.selectedTab = tab;
        const browser = tab.linkedBrowser;
        // juggler가 TabOpen을 받아 이 탭의 대상을 만들 때까지 기다린다
        let target = this._browserToTarget.get(browser);
        for (let waited = 0; !target; waited += 20) {
            if (waited > 30_000) throw new Error("tab target was not created");
            await new Promise((resolve) => win.setTimeout(resolve, 20));
            target = this._browserToTarget.get(browser);
        }
        browser.focus();
        if (browserContext.crossProcessCookie.settings.timezoneId && (await target.hasFailedToOverrideTimezone())) throw new Error("Failed to override timezone");
        return target.id();
    };

    // juggler는 페이지가 생길 때마다 창 innerWidth/innerHeight와의 차이만큼 resizeBy()로 창을 맞춘다.
    // Camoufox는 크롬 창의 inner 크기도 지문용 값으로 돌려주므로, 탭을 더할 때마다 이 계산이 다시 돌면
    // 창이 640x576처럼 줄어들고 그 밖으로 간 마우스 이벤트는 페이지에 닿지 않는다.
    // 같은 프로필의 탭은 뷰포트가 같으니 첫 탭이 맞춘 창 크기를 그대로 둔다.
    const fitViewport = PageTarget.prototype.updateViewportSize;
    PageTarget.prototype.updateViewportSize = async function () {
        const win = this._window;
        if (!(win?.gBrowser?.tabs.length > 1)) return fitViewport.call(this);
        const resizeBy = win.resizeBy;
        win.resizeBy = () => {};
        try {
            return await fitViewport.call(this);
        } finally {
            win.resizeBy = resizeBy;
        }
    };
} catch (e) {
    dump(`[tabybot] tab patch failed: ${e}\n`);
}

// 페이지 안의 window.focus()로 뒤에 있는 탭을 앞으로 가져올 수 있게 한다.
// browser_click과 컴퓨터 화면이 탭의 창을 찾을 때 창 제목은 앞에 있는 탭의 것만 보여 주기 때문이다.
defaultPref("dom.disable_window_flip", false);
