        <div id="app">
            <!-- ── 사이드바 ─────────────────────────── -->
            <aside id="sidebar" aria-label="tabyBot sidebar">
                <div class="sb-top">
                    <button id="btnCollapse" class="btn-icon" data-i18n-tip="collapse" data-i18n-aria="collapse" aria-expanded="true">
                        <svg class="icon"><use href="#i-chevron" /></svg>
                        <span id="mobileConnDot" class="conn-dot" hidden></span>
                    </button>
                    <span class="logo-word">tabyBot</span>
                    <button id="btnAddBot" class="btn-icon" data-i18n-tip="addAgent" data-i18n-aria="addAgent">
                        <svg class="icon"><use href="#i-plus" /></svg>
                    </button>
                </div>

                <div class="sb-search">
                    <svg class="icon icon-sm" aria-hidden="true"><use href="#i-search" /></svg>
                    <input
                        id="searchInput"
                        type="text"
                        data-i18n-ph="searchPlaceholder"
                        autocomplete="off"
                        spellcheck="false"
                        enterkeyhint="search"
                    />
                    <kbd>⌘K</kbd>
                    <button id="btnSearchClose" class="sb-search-close" type="button" data-i18n-aria="close" hidden>
                        <svg class="icon"><use href="#i-x" /></svg>
                    </button>
                </div>
                <!-- 모바일 목록 화면 아래에 뜨는 검색 버튼. 데스크톱에서는 숨는다 -->
                <button id="btnSearchFab" class="sb-search-fab" type="button" data-i18n-aria="searchPlaceholder">
                    <svg class="icon"><use href="#i-search" /></svg>
                </button>

                <div id="folderTabs" class="sb-tabs" role="tablist" aria-label="agent folders" hidden></div>
                <nav id="botList" class="sb-scroll" aria-label="agents"></nav>

                <div class="sb-bottom">
                    <button id="btnSettings" class="sb-row">
                        <svg class="icon icon-sm"><use href="#i-settings" /></svg>
                        <span data-i18n="settings"></span>
                        <span id="connDot" class="conn-dot" hidden></span>
                    </button>
                </div>
                <div id="sbResize" class="sb-resize" aria-hidden="true"></div>
            </aside>

            <!-- ── 메인 ─────────────────────────────── -->
            <div id="sbScrim" class="sb-scrim"></div>
            <main id="main">
                <header id="header">
                    <div class="pblur" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
                    <button id="btnMenu" class="btn-icon btn-menu" data-i18n-tip="menu" data-i18n-aria="menu" aria-expanded="false">
                        <svg class="icon"><use href="#i-menu" /></svg>
                    </button>
                    <span id="hdrAvatar" class="hdr-avatar"></span>
                    <div class="hd-name-wrap">
                        <span id="hdrName"></span>
                    </div>
                    <button id="btnHdrComputer" class="btn-icon" data-i18n-tip="computerOpenTip" data-i18n-aria="computerOpenTip">
                        <svg class="icon"><use href="#i-monitor" /></svg>
                    </button>
                </header>

                <div id="scroller">
                    <div id="thread" class="thread"></div>
                    <section id="todosPage" class="todos-page thread" hidden aria-label="todos" tabindex="-1"></section>
                </div>

                <button id="jumpLatest" class="jump-latest">
                    <svg class="icon icon-sm"><use href="#i-arrow-down" /></svg>
                </button>

                <div id="composerWrap">
                    <div class="pblur flip" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
                    <div id="composer" class="composer">
                        <div id="chips" class="chips hidden"></div>
                        <div class="composer-row">
                            <button id="btnAttach" class="btn-icon" data-i18n-tip="attachImage" data-i18n-aria="attachImage">
                                <svg class="icon"><use href="#i-paperclip" /></svg>
                            </button>
                            <button
                                id="btnHandoff"
                                class="btn-icon hidden"
                                data-i18n-tip="todosAssignLabel"
                                data-i18n-aria="todosAssignLabel"
                                aria-haspopup="menu"
                                aria-expanded="false"
                            >
                                <span class="at-sign" aria-hidden="true">@</span>
                            </button>
                            <input id="fileInput" type="file" multiple hidden />
                            <textarea id="composerInput" rows="1" enterkeyhint="send" data-i18n-ph="sendPlaceholder"></textarea>
                            <button id="btnSend" class="btn-send" disabled data-i18n-tip="send" data-i18n-aria="send">
                                <svg class="icon"><use href="#i-send" /></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 설정 페이지: 채팅 뷰(#header/#scroller/#composerWrap)와 같은 계층의 라우트 뷰 -->
                <section id="settingsPage" class="settings-page" hidden tabindex="-1"></section>

                <!-- 봇 컴퓨터 페이지(/c/<uuid>): 화면 스트림 + 터미널 -->
                <section id="computerPage" class="computer-page" hidden aria-label="computer" tabindex="-1"></section>
            </main>
        </div>

        <!-- 온보딩: 초기 설정이 안 된 경우에만 앱 전체를 덮는 전용 페이지 -->
        <section id="onboardingPage" class="onb-page" hidden aria-labelledby="onbTitle" tabindex="-1"></section>

        <!-- 오버레이 / 토스트 -->
        <div id="overlayRoot"></div>
        <div id="toasts" role="status" aria-live="polite"></div>

        <!--
  스크립트 로딩: 전역 네임스페이스(Taby)를 공유하는 클래식 스크립트 체인.
  Chrome은 file://에서 ES module 로드를 CORS로 차단하므로, file:// 직접 실행을
  보장하기 위해 IIFE + 네임스페이스 패턴을 사용한다(빌드 도구 없음 유지).
  의존성 순서는 유틸/i18n, 상태, API, 마크다운, SSE, UI, 부트다.
-->
        <script src="assets/js/util.js"></script>
        <script src="assets/js/dom.js"></script>
        <script src="assets/js/i18n/en.js"></script>
        <script src="assets/js/i18n/ko.js"></script>
        <script src="assets/js/i18n/ja.js"></script>
        <script src="assets/js/i18n/index.js"></script>
        <script src="assets/js/state/store.js"></script>
