# 로컬 데모용

name: tabybot-demo

services:
    tabybot-demo:
        build:
            context: .
            args:
                TABYBOT_VERSION: demo
        image: tabybot-demo:local
        pull_policy: build
        container_name: tabybot-demo
        labels:
            - tabybot.environment=demo
        environment:
            TABYBOT_MODE: docker
            TABYBOT_HOME: ""
            TABYBOT_DOCKER_SHELL: docker
            CAMOFOX_HOST: 127.0.0.1
            CAMOFOX_PORT: 9377
            CAMOFOX_AUTH_MODE: disabled
            CAMOFOX_HEADLESS: "false"
            CAMOFOX_HUMANIZE: "true"
            CAMOFOX_IDLE_TIMEOUT_MS: "3153600000000"
            CAMOFOX_IDLE_EXIT_TIMEOUT_MS: "3153600000000"
            CAMOFOX_SESSION_TIMEOUT: "3153600000000"
            CAMOFOX_PROFILES_DIR: /app/user/camofox/profiles
            CAMOFOX_COOKIES_DIR: /app/user/camofox/cookies
            CAMOFOX_DOWNLOADS_DIR: /app/user/camofox/downloads
            CAMOFOX_TRACES_DIR: /app/user/camofox/traces
        volumes:
            - tabybot-demo-user:/app/user
        ports:
            - "${TABYBOT_DEMO_BIND:-127.0.0.1}:${TABYBOT_DEMO_PORT:-8998}:8999"
        networks:
            - tabybot-demo-net
        restart: unless-stopped

networks:
    tabybot-demo-net:
        name: tabybot-demo-net
        driver: bridge

volumes:
    tabybot-demo-user:
        name: tabybot-demo-user
