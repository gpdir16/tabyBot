name: Publish Docker image

on:
    release:
        types: [published]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

env:
    IMAGE_NAME: ghcr.io/gpdir16/tabyagent

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Resolve image tags
              id: tags
              run: |
                  {
                    if [ "${{ github.event_name }}" = "release" ]; then
                      RELEASE_TAG="${{ github.event.release.tag_name }}"
                      echo "${{ env.IMAGE_NAME }}:latest"
                      echo "${{ env.IMAGE_NAME }}:${RELEASE_TAG}"
                      VERSION="${RELEASE_TAG#v}"
                      if [ -n "${VERSION}" ] && [ "${VERSION}" != "${RELEASE_TAG}" ]; then
                        echo "${{ env.IMAGE_NAME }}:${VERSION}"
                      fi
                    else
                      echo "${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
                    fi
                  } > tags.txt
                  echo "value<<EOF" >> "$GITHUB_OUTPUT"
                  cat tags.txt >> "$GITHUB_OUTPUT"
                  echo "EOF" >> "$GITHUB_OUTPUT"

            - name: Build and push (amd64 + arm64)
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  platforms: linux/amd64,linux/arm64
                  tags: ${{ steps.tags.outputs.value }}
                  build-args: |
                      TABYAGENT_VERSION=${{ github.event_name == 'release' && github.event.release.tag_name || format('sha-{0}', github.sha) }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
