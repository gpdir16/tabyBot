# Used by scripts/install.sh (GHCR image). For local dev, use docker-compose.yml.
services:
    tabybot:
        image: ghcr.io/gpdir16/tabybot:latest
        container_name: tabybot
        env_file:
            - .env
        environment:
            TABYBOT_MODE: docker
            TABYBOT_HOME: ${TABYBOT_HOME:-}
            TABYBOT_DOCKER_SHELL: ${TABYBOT_DOCKER_SHELL:-docker}
            WORKSPACE_DIR: /workspace
            WORKSPACE_ENABLED: ${WORKSPACE_ENABLED:-0}
        volumes:
            - tabybot-user:/app/user
        # Optional host folder: docker compose -f docker-compose.prod.yml -f docker-compose.workspace.yml up -d
        ports:
            - "${TABYBOT_PORT:-8999}:8999"
        restart: unless-stopped

volumes:
    tabybot-user:
